name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and protocol integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: lx_sync_test
          POSTGRES_USER: lx_sync
          POSTGRES_PASSWORD: integration-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lx_sync -d lx_sync_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.14.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: pnpm check

      - name: Run coverage tests
        run: pnpm test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Run PostgreSQL protocol integration
        env:
          ALLOW_TEST_DATABASE_WRITE: '1'
          TEST_DATABASE_URL: postgresql://lx_sync:integration-test-password@127.0.0.1:5432/lx_sync_test
        run: pnpm --filter @lx-sync/server test:integration

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E
        env:
          ADMIN_PASSWORD: e2e-admin-password-2026
          ADMIN_USERNAME: e2e-admin
          DATABASE_URL: postgresql://lx_sync:integration-test-password@127.0.0.1:5432/lx_sync_test
          HOST: 127.0.0.1
          LOG_LEVEL: silent
          MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          NODE_ENV: test
          PORT: '9527'
          PUBLIC_ORIGIN: http://127.0.0.1:9527
        run: pnpm test:e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
