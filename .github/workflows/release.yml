name: Container image

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    paths:
      - .dockerignore
      - .github/workflows/release.yml
      - Dockerfile
      - apps/**
      - biome.json
      - package.json
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
  push:
    branches:
      - main
    tags:
      - v*.*.*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: lx_sync_test
          POSTGRES_USER: lx_sync
          POSTGRES_PASSWORD: integration-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lx_sync -d lx_sync_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.14.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node <<'NODE'
          const rootVersion = require('./package.json').version
          const serverVersion = require('./apps/server/package.json').version
          const expectedTag = `v${rootVersion}`
          const actualTag = process.env.GITHUB_REF_NAME

          if (serverVersion !== rootVersion) {
            throw new Error(
              `Version mismatch: package.json=${rootVersion}, apps/server/package.json=${serverVersion}`,
            )
          }
          if (actualTag !== expectedTag) {
            throw new Error(`Release tag ${actualTag} must equal ${expectedTag}`)
          }
          NODE

          release_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "Release tag must point to a commit reachable from origin/main" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: pnpm check

      - name: Run PostgreSQL protocol integration
        env:
          ALLOW_TEST_DATABASE_WRITE: '1'
          TEST_DATABASE_URL: postgresql://lx_sync:integration-test-password@127.0.0.1:5432/lx_sync_test
        run: pnpm --filter @lx-sync/server test:integration

  validate-image:
    name: Validate Docker image
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
      !contains(github.event.pull_request.labels.*.name, 'publish-image'))
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build image without publishing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false

  publish:
    name: Publish multi-platform image
    if: >-
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'publish-image'))
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve canonical image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:candidate-${{ github.sha }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false
          sbom: true
          cache-from: type=gha,scope=container-release
          cache-to: type=gha,mode=max,scope=container-release

      - name: Verify published platforms
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect "${IMAGE_NAME}@${IMAGE_DIGEST}" --raw)"
          for architecture in amd64 arm64; do
            jq -e \
              --arg architecture "$architecture" \
              '.manifests | any(.platform.os == "linux" and .platform.architecture == $architecture)' \
              <<<"$manifest" >/dev/null
          done

      - name: Attest image provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Promote verified image tags
        shell: bash
        env:
          FINAL_TAGS: ${{ steps.metadata.outputs.tags }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mapfile -t final_tags < <(printf '%s\n' "$FINAL_TAGS" | sed '/^$/d')
          if [[ "${#final_tags[@]}" -eq 0 ]]; then
            echo "No final image tags were generated" >&2
            exit 1
          fi

          tag_arguments=()
          for tag in "${final_tags[@]}"; do
            tag_arguments+=(--tag "$tag")
          done

          promoted=false
          for attempt in 1 2 3; do
            if docker buildx imagetools create \
              "${tag_arguments[@]}" \
              "${IMAGE_NAME}@${IMAGE_DIGEST}"; then
              promoted=true
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep "$((attempt * 5))"
            fi
          done
          if [[ "$promoted" != true ]]; then
            echo "Failed to promote final image tags after 3 attempts" >&2
            exit 1
          fi

          for tag in "${final_tags[@]}"; do
            promoted_digest=""
            for attempt in 1 2 3 4 5; do
              if promoted_digest="$(
                docker buildx imagetools inspect "$tag" \
                  | awk '/^Digest:/ { print $2; exit }'
              )" && [[ "$promoted_digest" == "$IMAGE_DIGEST" ]]; then
                break
              fi
              if [[ "$attempt" -lt 5 ]]; then
                sleep "$((attempt * 2))"
              fi
            done
            if [[ "$promoted_digest" != "$IMAGE_DIGEST" ]]; then
              echo "Promoted tag $tag resolved to $promoted_digest, expected $IMAGE_DIGEST" >&2
              exit 1
            fi
          done

      - name: Record immutable image digest
        run: |
          {
            echo "### Published image"
            echo
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo "- Mutable \`latest\` tag: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
